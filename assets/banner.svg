<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Studio Method · App + Site Kit</title>
  <desc id="d">Build a React Native app and its website, wire the services, ship to the stores.</desc>
  <style>
    .bg{fill:#FDFCF7}.ink{fill:#1C1917}.muted{fill:#6B635D}.amber{fill:#D97706}.ring{fill:none;stroke:#D97706}.soft{fill:#FEF3C7}
    @media (prefers-color-scheme:dark){.bg{fill:#161311}.ink{fill:#F5EFE9}.muted{fill:#A89E95}.amber{fill:#F59E0B}.ring{stroke:#F59E0B}.soft{fill:#2A2118}}
    text{font-family:"Plus Jakarta Sans","Segoe UI",Inter,system-ui,-apple-system,sans-serif}
  </style>
  <rect class="bg" width="1200" height="300" rx="24"/>
  <circle class="soft" cx="1040" cy="150" r="190"/>
  <!-- mark: a phone and a browser window joined by one loop -->
  <g transform="translate(92 86)">
    <circle class="amber" cx="64" cy="64" r="64"/>
    <rect x="36" y="30" width="30" height="54" rx="7" fill="none" stroke="#fff" stroke-width="5"/>
    <rect x="62" y="44" width="38" height="30" rx="5" fill="none" stroke="#fff" stroke-width="5"/>
    <path d="M51 98 q13 12 26 0" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text class="ink" x="252" y="140" font-size="58" font-weight="800" letter-spacing="-1.5">Studio Method</text>
  <text class="amber" x="256" y="182" font-size="26" font-weight="700">App + Site Kit</text>
  <text class="muted" x="256" y="222" font-size="22">Build the app and its website, wire the services, ship to the stores.</text>
  <circle class="ring" cx="1040" cy="150" r="120" stroke-width="2" stroke-dasharray="4 10"/>
</svg>
